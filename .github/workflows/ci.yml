# CI: three parallel jobs, all keys-free.
#
# mocked-tests: runs the fully mocked test suites (tests/node/ + tests/graph/ +
# tests/evals/) on every push and pull request. These suites mock every external
# dependency at its lazy factory seam (tests/evals/ covers only the eval
# harness's pure helpers), so the job needs NO API keys (OpenAI / Tavily /
# LangSmith). The integration suite (tests/chains/) calls the real model and the
# full eval run (evals/run_eval.py) costs real API money; both are deliberately
# excluded from CI.
#
# lint: runs ruff (lint + format check) and mypy (scoped to graph/engine.py,
# graph/config.py, graph/formatting.py, graph/state.py, graph/consts.py).
# No API keys required. Runs in parallel with mocked-tests so test feedback
# is never delayed by lint failures.
#
# frontend: installs the committed npm dependency graph with Node 20, then
# type-checks, tests, and builds the Vite application without watch mode.

name: CI

on:
  push:
  pull_request:

jobs:
  mocked-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv (with Python 3.12 and dependency cache)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from the committed lockfile
        run: uv sync --locked --group dev

      - name: Run mocked test suites (no API keys required)
        run: uv run pytest tests/node/ tests/graph/ tests/evals/ tests/server/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv (with Python 3.12 and dependency cache)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from the committed lockfile
        run: uv sync --locked --group dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type-check scoped modules with mypy
        run: uv run mypy

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from the committed lockfile
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build
